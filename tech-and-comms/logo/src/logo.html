<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MB;src:url(montserrat-latin-900-normal.woff2)}
@font-face{font-family:AB;src:url(archivo-black-latin-400-normal.woff2)}
html,body{margin:0;background:transparent}
.logo{display:inline-block;padding:var(--pad);text-align:center;line-height:.98}
.l1{font-size:var(--s);color:var(--navy);letter-spacing:-.03em;white-space:nowrap}
.amp{color:var(--blue)}
.box{display:inline-block;position:relative;margin-top:calc(var(--s)*.06);background:var(--blue);color:var(--box);font-size:calc(var(--s)*1.02);padding:calc(var(--s)*.01) calc(var(--s)*.16) calc(var(--s)*.02);outline:calc(var(--s)*.022) solid var(--blue);outline-offset:0;white-space:nowrap}
.box i{position:absolute;width:calc(var(--s)*.13);height:calc(var(--s)*.13);background:#fff;border:calc(var(--s)*.025) solid var(--blue);box-sizing:border-box}
.box i:nth-child(1){left:calc(var(--s)*-.09);top:calc(var(--s)*-.09)}.box i:nth-child(2){right:calc(var(--s)*-.09);top:calc(var(--s)*-.09)}
.box i:nth-child(3){left:calc(var(--s)*-.09);bottom:calc(var(--s)*-.09)}.box i:nth-child(4){right:calc(var(--s)*-.09);bottom:calc(var(--s)*-.09)}
</style></head><body>
<div class="logo" id="L" style="--s:110px;--pad:30px;--navy:#0D1440;--blue:#1F6BFD;--box:#fff;font-family:MB">
<div class="l1">TECH <span class="amp">&amp;</span></div><span class="box">COMMS<i></i><i></i><i></i><i></i></span></div>
</body></html>
