<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:AB;src:url(kit/fonts/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(kit/fonts/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(kit/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(kit/fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(kit/fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:800;font-style:italic;src:url(kit/fonts/montserrat-latin-800-italic.woff2)}
@font-face{font-family:S;font-style:italic;src:url(kit/fonts/dm-serif-display-latin-400-italic.woff2)}
:root{--navy:#131838;--blue:#5a7bfe;--soft:#dfe6ff;--yellow:#ffd60a;--paper:#f2f5fc;--grid:#e2e8f8;--muted:#4b537a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden}
.slide{position:relative;width:1080px;height:1080px;overflow:hidden;font-family:M,sans-serif;color:var(--navy);
  background:radial-gradient(circle at 85% 10%,rgba(90,123,254,.10),transparent 40%),var(--paper);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:90px 90px;background-color:var(--paper)}
.abs{position:absolute}
.logo{left:50%;top:44px;transform:translateX(-50%);height:96px}
.strip{left:20px;top:950px;width:1040px}
.ast{color:var(--blue)}
.ast svg{width:100%;height:100%;display:block}
.eyebrow{font:700 26px M;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);text-align:center}
.title{font:400 112px/1 AB;text-align:center;color:var(--navy)}
.amp{color:var(--blue)}
.boxed{display:inline-block;position:relative;background:var(--blue);color:#fff;padding:0 20px;outline:4px solid var(--blue);outline-offset:9px}
.boxed s{position:absolute;width:20px;height:20px;background:#fff;border:4px solid var(--blue)}
.boxed s:nth-child(1){left:-22px;top:-22px}.boxed s:nth-child(2){right:-22px;top:-22px}.boxed s:nth-child(3){left:-22px;bottom:-22px}.boxed s:nth-child(4){right:-22px;bottom:-22px}
.tag{display:inline-block;background:var(--yellow);color:var(--navy);font:italic 800 36px M;padding:14px 34px;transform:rotate(-3deg);box-shadow:0 14px 30px -14px rgba(19,24,56,.5);clip-path:polygon(2% 0,100% 6%,98% 100%,0 92%)}
.dateline{left:0;right:0;top:895px;text-align:center;font:800 24px M;letter-spacing:.04em;text-transform:uppercase}
.swipe{right:64px;top:72px;font:800 24px M;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.count{left:64px;top:72px;font:800 22px M;letter-spacing:.2em;color:var(--muted)}
.serif{font-family:S;font-style:italic;font-weight:400}
/* speaker slide */
.photo{left:50%;top:205px;transform:translateX(-50%);width:400px;height:440px;border-radius:30px;overflow:hidden;background:var(--soft);display:grid;place-items:center;box-shadow:0 30px 60px -34px rgba(19,24,56,.6)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.photo svg{width:45%;color:var(--navy)}
.photo.dark{background:var(--navy)}
.role{left:0;right:0;top:672px;text-align:center}
.role span{display:inline-block;background:var(--navy);color:#fff;font:800 22px M;letter-spacing:.24em;text-transform:uppercase;padding:10px 22px;border-radius:999px}
.name{left:0;right:0;top:728px;text-align:center;font:400 64px/1 AB;text-transform:uppercase}
.topic{left:90px;right:90px;top:812px;text-align:center;font:italic 400 36px/1.2 S;color:var(--muted)}
/* lists */
.list{left:120px;right:120px;display:grid;gap:22px}
.row{display:flex;gap:26px;align-items:center;background:#fff;border-radius:22px;padding:22px 28px;box-shadow:0 20px 40px -30px rgba(19,24,56,.5)}
.row .n{flex:none;font:400 52px/1 AB;color:#fff;background:var(--blue);padding:8px 16px;outline:3px solid var(--blue);outline-offset:5px}
.row b{font:800 32px/1.2 M;text-transform:uppercase}
.row small{display:block;font:italic 400 26px/1.25 S;color:var(--muted);text-transform:none;margin-top:4px}
.big{left:80px;right:80px;text-align:center;font:400 92px/1.02 AB}
.big em{display:block;font:italic 400 100px/1.1 S;color:var(--blue)}
.pill{display:inline-block;background:var(--navy);color:#fff;font:800 30px M;padding:20px 40px;border-radius:999px}
</style></head>
<body><div id="root"></div>
<script>
const AST='<svg viewBox="-50 -50 100 100"><g fill="currentColor"><rect x="-10" y="-48" width="20" height="96" rx="10"/><rect x="-10" y="-48" width="20" height="96" rx="10" transform="rotate(60)"/><rect x="-10" y="-48" width="20" height="96" rx="10" transform="rotate(120)"/></g></svg>';
const PERSON='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 22c0-5 4-8.5 9-8.5s9 3.5 9 8.5z"/></svg>';
const base=(inner,o={})=>`<div class="slide">
  <span class="abs ast" style="right:-70px;top:120px;width:230px;height:230px;opacity:.85">${AST}</span>
  <span class="abs ast" style="left:-90px;top:520px;width:180px;height:180px;opacity:.25;filter:blur(3px)">${AST}</span>
  <img class="abs logo" src="kit/tcbr-logo.png">
  ${inner}
  ${o.noDate?'':`<div class="abs dateline">26th Nov. 2026 · Legacy Hall, Crawford University</div>`}
  ${o.count?`<div class="abs count">${o.count}</div>`:''}${o.swipe?`<div class="abs swipe">Swipe →</div>`:''}
  <img class="abs strip" src="kit/partner-strip.png"></div>`;
const boxed=t=>`<span class="boxed">${t}<s></s><s></s><s></s><s></s></span>`;
const S={
 'speakers-00-cover':()=>base(`
   <div class="abs eyebrow" style="left:0;right:0;top:210px">Meet the voices</div>
   <div class="abs title" style="left:0;right:0;top:275px">TECH <span class="amp">&amp;</span><br>${boxed('COMMS')}</div>
   <div class="abs" style="left:0;right:0;top:575px;text-align:center"><span class="tag">Speakers &amp; Panelists</span></div>
   <div class="abs" style="left:110px;right:110px;top:690px;text-align:center;font:600 32px/1.4 M;color:var(--muted)">Five practitioners. Three talks, one panel, and your questions.</div>`,{swipe:1,count:'1 / 6'}),
 'speakers-01-gabriel':()=>spk('Gabriel Ntoka','Speaker · Topic 01','Communications: School vs Reality','',2),
 'speakers-02-samuel':()=>spk('Samuel Ogundeji','Host &amp; Speaker · Topic 02','Media Monitoring, Intelligence, Social Listening and AI','kit/samuel.jpg',3),
 'speakers-03-onaopemipo':()=>spk('Onaopemipo Famori','Speaker · Topic 03','Building a Personal Brand','kit/onaopemipo.jpg',4),
 'speakers-04-barnabas':()=>spk('Barnabas','Panelist','You Media: the new normal in the media landscape','',5),
 'speakers-05-samuel-jegede':()=>spk('Samuel Jegede','Panelist','Communications in humanitarian work','',6),
 'topics-00-cover':()=>base(`
   <div class="abs eyebrow" style="left:0;right:0;top:190px">Key topics · Tech &amp; Comms</div>
   <div class="abs big" style="top:240px;font-size:64px">Three conversations<em style="font-size:76px">every Mass Comm student deserves.</em></div>
   <div class="abs list" style="top:480px;gap:16px">
     <div class="row"><span class="n">01</span><b>Communication: school vs reality</b></div>
     <div class="row"><span class="n">02</span><b>Media monitoring &amp; intelligence</b></div>
     <div class="row"><span class="n">03</span><b>Your professional presence</b></div></div>`,{swipe:1,count:'1 / 5'}),
 'topics-04-panel':()=>base(`
   <div class="abs eyebrow" style="left:0;right:0;top:190px">Plus the panel</div>
   <div class="abs big" style="top:240px;font-size:72px">Where communications<em style="font-size:84px">can take you.</em></div>
   <div class="abs list" style="top:510px">
     <div class="row"><span class="n" style="font-size:40px">YOU</span><div><b>You Media</b><small>The new normal in the media landscape · Barnabas</small></div></div>
     <div class="row"><span class="n" style="font-size:40px">+</span><div><b>Humanitarian communications</b><small>One discipline, many paths · Samuel Jegede</small></div></div></div>
   <div class="abs" style="left:0;right:0;top:820px;text-align:center;font:700 28px M;color:var(--muted)">Then an open Q&amp;A from the floor.</div>`,{count:'5 / 5'}),
 'next-2027':()=>base(`
   <div class="abs eyebrow" style="left:0;right:0;top:200px">Tech &amp; Comms · 2027</div>
   <div class="abs big" style="top:262px">Where should we<br>go next?<em>Your university?</em></div>
   <div class="abs" style="left:110px;right:110px;top:610px;text-align:center;font:600 34px/1.4 M;color:var(--muted)">Tell us which university Tech &amp; Comms should visit first in 2027.</div>
   <div class="abs" style="left:0;right:0;top:735px;text-align:center"><span class="tag" style="font-size:34px">Comment your school · Register it on our website</span></div>
   <div class="abs" style="left:0;right:0;top:838px;text-align:center;font:800 30px M;color:var(--blue)">tech-and-comms.vercel.app</div>`,{noDate:1}),
};
function spk(name,role,topic,img,n){
  const ph=img?`<img src="${img}">`:PERSON;
  return base(`<div class="abs photo">${ph}</div><div class="abs role"><span>${role}</span></div>
    <div class="abs name">${name}</div><div class="abs topic">${topic}</div>`,{count:`${n} / 6`,swipe:n<6});
}
window.SLIDES=Object.keys(S);
window.show=k=>{document.getElementById('root').innerHTML=S[k]();};
</script></body></html>
