:root{--deep:#071566;--yellow:#ffd60a;--blue:#5379F6}
*{box-sizing:border-box;margin:0}
body{background:var(--deep);color:#fff;font-family:M,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;overflow:hidden;
 background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:6vw 6vw}
h1{font:400 4vw AB;letter-spacing:.02em} h1 span{color:var(--yellow)}
#n{font:400 26vh/1 AB;color:var(--yellow);min-height:26vh;text-shadow:0 1vh 4vh rgba(0,0,0,.35)}
.row{display:flex;gap:1.5vw;align-items:center;font-size:2vh}
input{width:7em;font:700 2.4vh M;padding:.6vh .8vw;border-radius:1vh;border:0;text-align:center}
button{font:700 2.6vh M;padding:1.6vh 3vw;border-radius:99px;border:0;background:var(--yellow);color:var(--deep);cursor:pointer}
button.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
#drawn{max-width:80vw;text-align:center;font-size:2.2vh;color:rgba(255,255,255,.8);min-height:3vh}
.hint{font-size:1.6vh;color:rgba(255,255,255,.55)}
</style></head><body>
<h1>TECH &amp; COMMS · <span>RAFFLE DRAW</span></h1>
<div id="n">?</div>
<div class="row"><label>From <input id="lo" type="number" value="1" min="1"></label><label>to <input id="hi" type="number" value="300" min="1"></label></div>
<div class="row"><button id="go">Draw a number</button><button class="ghost" id="reset">Reset</button></div>
<div id="drawn"></div>
<div class="hint">Press Space to draw. Numbers already drawn are not drawn again. Works offline.</div>
<script>
const n=document.getElementById('n'),lo=document.getElementById('lo'),hi=document.getElementById('hi'),drawn=document.getElementById('drawn');
let used=[];let busy=false;
function draw(){if(busy)return;const a=Math.min(+lo.value,+hi.value),b=Math.max(+lo.value,+hi.value);
 const pool=[];for(let i=a;i<=b;i++)if(!used.includes(i))pool.push(i);
 if(!pool.length){n.textContent='Done';return;}
 busy=true;const pick=pool[Math.floor(Math.random()*pool.length)];let t=0;
 const iv=setInterval(()=>{n.textContent=pool[Math.floor(Math.random()*pool.length)];if(++t>22){clearInterval(iv);n.textContent=pick;used.push(pick);drawn.textContent='Drawn: '+used.join(', ');busy=false;}},60);}
document.getElementById('go').onclick=draw;
document.getElementById('reset').onclick=()=>{used=[];drawn.textContent='';n.textContent='?';};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();draw();}});
</script></body></html>
